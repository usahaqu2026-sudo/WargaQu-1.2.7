<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulator HP & Header WargaQu</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 antialiased selection:bg-emerald-600 selection:text-white">

  <!-- ========================================================================= -->
  <!-- 1. TOP BAR SIMULATOR (Pill Badge Rapi dengan Jarak mb-4 di Atas Bezel HP)  -->
  <!-- ========================================================================= -->
  <div class="flex items-center gap-2 mb-4 px-3.5 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-xs text-slate-300 shadow-md backdrop-blur select-none">
    <div class="flex items-center gap-1.5 font-medium text-white">
      <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2" stroke-width="2"/>
        <line x1="12" y1="18" x2="12.01" y2="18" stroke-width="2"/>
      </svg>
      <span>Simulasi WargaQu:</span>
    </div>
    <span class="px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-600 text-white shadow-xs">
      HP Portrait Frame
    </span>
    <span class="text-[11px] text-slate-400 font-mono">380 x 820</span>
  </div>

  <!-- ========================================================================= -->
  <!-- 2. BEZEL SIMULATOR HP (max-w-[380px], rounded-[40px], shadow-2xl, camera) -->
  <!-- ========================================================================= -->
  <div class="w-full max-w-[380px] h-[820px] max-h-[90vh] rounded-[40px] border-[8px] border-slate-900 shadow-2xl ring-1 ring-white/10 flex flex-col bg-stone-100 text-stone-900 overflow-hidden relative">

    <!-- Status Bar HP (Jam, Punch Hole Kamera, Sinyal, Baterai) -->
    <div class="bg-emerald-950 text-white px-4 pt-2.5 pb-1.5 flex items-center justify-between text-[11px] font-semibold shrink-0 select-none border-b border-emerald-900/40">
      <span class="font-mono font-bold text-[11px] w-12 text-left">09:41</span>
      
      <!-- Punch Hole Kamera Depan -->
      <div class="w-3.5 h-3.5 rounded-full bg-black border border-stone-800 shadow-inner flex items-center justify-center -mt-0.5">
        <div class="w-1.5 h-1.5 rounded-full bg-slate-900"></div>
      </div>

      <div class="flex items-center gap-1.5 w-14 justify-end text-[10px]">
        <span class="font-bold opacity-80 text-[9px]">5G</span>
        <svg class="w-3 h-3 opacity-90" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"/>
        </svg>
        <span class="font-bold text-emerald-400">98%</span>
      </div>
    </div>

    <!-- ========================================================================= -->
    <!-- 3. HEADER APLIKASI (Di Dalam HP - Flex justify-between, 2 Grup Utama)     -->
    <!-- ========================================================================= -->
    <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur px-2.5 py-1.5 flex items-center justify-between shrink-0 select-none shadow-xs">
      
      <!-- GRUP KIRI: Menu Hamburger + Judul PAGUYUBANQU & Sub-badge RT/RW -->
      <div class="flex items-center gap-1.5 min-w-0 shrink">
        <!-- Tombol Menu Hamburger -->
        <button type="button" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 border border-slate-300 text-emerald-700 flex items-center justify-center cursor-pointer transition active:scale-95 shrink-0" aria-label="Menu Opsi">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <line x1="3" y1="12" x2="21" y2="12" stroke-width="2" stroke-linecap="round"/>
            <line x1="3" y1="6" x2="21" y2="6" stroke-width="2" stroke-linecap="round"/>
            <line x1="3" y1="18" x2="21" y2="18" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>

        <!-- Logo Avatar WQ -->
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-emerald-600 to-teal-700 flex items-center justify-center font-black text-white text-[11px] shadow-sm shrink-0">
          WQ
        </div>

        <!-- Identitas Modul & Badge -->
        <div class="min-w-0 shrink">
          <div class="flex items-center gap-1">
            <span class="text-[10px] font-black uppercase text-emerald-600 tracking-wider">
              PAGUYUBANQU
            </span>
            <span class="text-[8.5px] px-1 py-0.2 rounded font-bold bg-emerald-50 text-emerald-800 border border-emerald-200 shrink-0">
              RT/RW
            </span>
          </div>
          <h1 class="text-xs font-black truncate max-w-[110px] xs:max-w-[130px] leading-tight text-slate-900">
            DKM Al-Hidayah
          </h1>
        </div>
      </div>

      <!-- GRUP KANAN: Action buttons (Switch Org, Tambah, Theme, Login) -->
      <div class="flex items-center gap-1.5 shrink-0 overflow-x-auto no-scrollbar py-0.5 max-w-[58%] justify-end">
        <!-- 1. Tombol Switch Org -->
        <button type="button" class="h-6.5 px-2 rounded-lg text-[10px] font-bold bg-emerald-50 text-emerald-800 hover:bg-emerald-100 border border-emerald-300 flex items-center gap-1 transition active:scale-95 cursor-pointer shrink-0">
          <svg class="w-3 h-3 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>Org</span>
        </button>

        <!-- 2. Tombol Tambah (+) -->
        <button type="button" class="h-6.5 w-6.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-emerald-700 border border-slate-300 flex items-center justify-center transition active:scale-95 cursor-pointer shrink-0">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="5" y1="12" x2="19" y2="12" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </button>

        <!-- 3. Tombol Toggle Tema (Sun/Moon) -->
        <button type="button" class="h-6.5 w-6.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 flex items-center justify-center transition active:scale-95 cursor-pointer shrink-0">
          <svg class="w-3.5 h-3.5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5" stroke-width="2"/>
            <line x1="12" y1="1" x2="12" y2="3" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="21" x2="12" y2="23" stroke-width="2" stroke-linecap="round"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke-width="2" stroke-linecap="round"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke-width="2" stroke-linecap="round"/>
            <line x1="1" y1="12" x2="3" y2="12" stroke-width="2" stroke-linecap="round"/>
            <line x1="21" y1="12" x2="23" y2="12" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>

        <!-- 4. Tombol Login Akun -->
        <button type="button" class="h-6.5 px-2 rounded-lg border border-slate-300 bg-slate-100 hover:bg-slate-200 text-slate-800 text-[10px] flex items-center gap-1 transition active:scale-95 cursor-pointer shrink-0">
          <svg class="w-3 h-3 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke-width="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke-width="2"/>
          </svg>
          <span class="font-bold text-amber-600">Login</span>
          <span class="font-mono text-[8px] px-1 rounded bg-white text-emerald-700 font-bold">T1</span>
        </button>
      </div>
    </header>

    <!-- Konten Layar Dalam HP (Scrollable & Safe Curvature) -->
    <main class="flex-1 overflow-y-auto p-3 space-y-3 bg-stone-50 text-stone-800">
      <div class="p-3 bg-white rounded-2xl shadow-xs border border-stone-200">
        <h3 class="text-xs font-bold text-emerald-800 uppercase tracking-wider mb-1">Status Komunitas</h3>
        <p class="text-xs text-stone-600 leading-relaxed">
          Tampilan header dan frame HP telah dirapikan. Komponen tidak lagi saling bertumpuk dan pas di layar ponsel 380px.
        </p>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div class="p-3 bg-emerald-900 text-white rounded-xl shadow-xs">
          <div class="text-[10px] text-emerald-300 font-semibold">Kas Paguyuban</div>
          <div class="text-sm font-black mt-0.5">Rp 14.850.000</div>
        </div>
        <div class="p-3 bg-teal-900 text-white rounded-xl shadow-xs">
          <div class="text-[10px] text-teal-300 font-semibold">Warga Aktif</div>
          <div class="text-sm font-black mt-0.5">142 KK</div>
        </div>
      </div>
    </main>

    <!-- Navigasi Bawah Bawaan HP (Back, Home, Recents) -->
    <footer class="bg-stone-900 text-stone-400 py-2 px-8 flex items-center justify-around shrink-0 select-none border-t border-stone-800">
      <div class="w-5 h-5 flex items-center justify-center text-stone-400">‹</div>
      <div class="w-20 h-1 bg-stone-500 rounded-full"></div>
      <div class="w-3.5 h-3.5 border border-stone-400 rounded-xs"></div>
    </footer>

  </div>

</body>
</html>
