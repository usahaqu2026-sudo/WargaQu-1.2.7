<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Center Card Emblem -->
  <g filter="url(#shadow)">
    <rect x="86" y="86" width="340" height="340" rx="72" fill="#064e3b" stroke="url(#emblemGrad)" stroke-width="6"/>
  </g>

  <!-- Stylized WQ Typography -->
  <g fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" text-anchor="middle">
    <text x="256" y="295" font-size="160" letter-spacing="-6" fill="#ffffff">WQ</text>
  </g>

  <!-- Top Accent Dot / Leaf -->
  <circle cx="360" cy="180" r="18" fill="#34d399"/>
  <circle cx="360" cy="180" r="9" fill="#ffffff"/>

  <!-- Subtitle Tag -->
  <rect x="140" y="325" width="232" height="34" rx="17" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="2"/>
  <text x="256" y="348" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#a7f3d0" text-anchor="middle" letter-spacing="2">WARGAQU</text>
</svg>
